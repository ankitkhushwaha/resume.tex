name: Compile LaTeX Resume and Commit PDF

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.tex'
      - '.github/workflows/compile-and-deploy.yml'
  workflow_dispatch:  # Allows manual trigger

jobs:
  compile-and-commit:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Permission to commit and push
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          
      - name: Verify PDF was created
        run: |
          if [ -f "resume.pdf" ]; then
            echo "PDF compiled successfully"
            ls -lh resume.pdf
          else
            echo "PDF compilation failed"
            exit 1
          fi
          mkdir -p build
          mv resume.pdf build/resume.pdf
          ls -lh build/resume.pdf
          
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Commit and Push PDF
        run: |
          git add -f build/resume.pdf
          # Try to commit, but don't fail if there are no changes
          git commit -m "Build: Compile LaTeX resume to PDF [$(date '+%Y-%m-%d %H:%M:%S')]" || true
          git push origin HEAD:main || echo "Push failed or no changes to push"